<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QRIS - R STORE</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #0f0f1a 100%);
      min-height: 100vh;
      color: #fff;
    }
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      z-index: 1000;
    }
    .nav-container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; }
    .nav-logo i { color: #667eea; }
    .qris-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 90px 20px 40px;
    }
    .qris-card {
      background: rgba(20, 20, 40, 0.95);
      border-radius: 32px;
      padding: 32px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .qr-wrapper {
      background: white;
      padding: 20px;
      border-radius: 24px;
      display: inline-block;
      margin: 20px 0;
    }
    .qr-wrapper img { width: 250px; height: 250px; }
    .amount-display {
      background: rgba(0,212,255,0.15);
      border-radius: 40px;
      padding: 12px 24px;
      display: inline-block;
      margin: 15px 0;
    }
    .amount-display span { font-size: 28px; font-weight: 800; color: #00d4ff; }
    .timer-box {
      background: rgba(255,193,7,0.1);
      border-radius: 16px;
      padding: 12px;
      margin: 15px 0;
    }
    .timer-value { font-size: 28px; font-weight: 800; font-family: monospace; color: #ffc107; }
    .btn-confirm {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      border-radius: 16px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-box {
      background: rgba(102,126,234,0.15);
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
    }
    .error-box {
      background: rgba(220,53,69,0.15);
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
      color: #f87171;
      display: none;
    }
    .footer { text-align: center; padding: 30px; color: #a0a0b0; font-size: 12px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo"><i class="fas fa-gamepad"></i><span>R STORE</span></div>
    <a href="index.html" style="background:rgba(102,126,234,0.2); padding:8px 16px; border-radius:10px; text-decoration:none; color:#fff;">Beranda</a>
  </div>
</nav>

<div class="qris-container">
  <div class="qris-card">
    <h2><i class="fas fa-qrcode"></i> Scan QRIS</h2>
    <p>Bayar dengan DANA / GoPay / OVO</p>

    <div class="qr-wrapper">
      <img id="qrisImage" src="" alt="QRIS Code">
    </div>

    <div class="amount-display">
      <span id="qrisAmount">Rp 0</span>
    </div>

    <div class="timer-box">
      <div><i class="fas fa-hourglass-half"></i> Sisa waktu pembayaran</div>
      <div class="timer-value" id="timerValue">02:00:00</div>
    </div>

    <div class="status-box" id="statusBox">
      <i class="fas fa-clock"></i> <span id="statusText">Menunggu pembayaran...</span>
    </div>

    <div id="errorBox" class="error-box"></div>

    <button id="confirmBtn" class="btn-confirm">
      <i class="fas fa-check-circle"></i> Saya sudah bayar
    </button>

    <div style="margin-top: 16px; font-size: 11px; color: #a0a0b0;">
      <i class="fas fa-info-circle"></i> Setelah klik tombol di atas, pesanan akan masuk ke antrian admin untuk diverifikasi.
    </div>
  </div>
</div>

<footer class="footer">
  <p>&copy; 2025 R STORE — Unofficial Roblox Store</p>
</footer>

<script type="module">
  import { db, doc, getDoc, updateDoc, onSnapshot } from './firebase-config.js';

  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('orderId');
  const amountParam = urlParams.get('amount');

  if (!orderId) {
    alert('Order ID tidak ditemukan!');
    window.location.href = 'index.html';
  }

  let currentAmount = parseInt(amountParam) || 0;
  let unsubscribe = null;
  let timerInterval = null;

  function formatTime(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function startTimer(expireAtDate) {
    if (timerInterval) clearInterval(timerInterval);
    
    function updateTimer() {
      const remaining = Math.max(0, Math.floor((expireAtDate.getTime() - new Date().getTime()) / 1000));
      const timerValue = document.getElementById('timerValue');
      if (timerValue) timerValue.textContent = formatTime(remaining);
      
      if (remaining <= 0) {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('statusText').innerHTML = '<i class="fas fa-times-circle"></i> Waktu habis! Pesanan dibatalkan.';
        document.getElementById('confirmBtn').disabled = true;
      }
    }
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  async function generateQRIS() {
    try {
      const response = await fetch(`/api/qris-dynamic?amount=${currentAmount}`);
      const data = await response.json();
      
      if (data.success && data.qr_base64) {
        document.getElementById('qrisImage').src = data.qr_base64;
        document.getElementById('qrisAmount').textContent = 'Rp ' + currentAmount.toLocaleString('id-ID');
      } else {
        throw new Error(data.error || 'Gagal generate QRIS');
      }
    } catch (error) {
      document.getElementById('errorBox').innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + error.message;
      document.getElementById('errorBox').style.display = 'block';
    }
  }

  async function confirmPayment() {
    const confirmBtn = document.getElementById('confirmBtn');
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<div style="display:inline-block; width:16px; height:16px; border:2px solid white; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite;"></div> Memproses...';
    
    try {
      const orderRef = doc(db, 'orders', orderId);
      await updateDoc(orderRef, {
        status: 'pending_verification',
        paymentProof: 'manual_confirm',
        confirmedAt: new Date(),
        updatedAt: new Date()
      });
      
      document.getElementById('statusText').innerHTML = '<i class="fas fa-clock"></i> ✅ Pesanan masuk antrian admin. Mohon tunggu verifikasi.';
      document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-check-circle"></i> Menunggu Verifikasi Admin';
      document.getElementById('confirmBtn').disabled = true;
      
    } catch (error) {
      document.getElementById('errorBox').innerHTML = '<i class="fas fa-exclamation-circle"></i> Gagal: ' + error.message;
      document.getElementById('errorBox').style.display = 'block';
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '<i class="fas fa-check-circle"></i> Coba lagi';
    }
  }

  function listenOrderStatus() {
    const orderRef = doc(db, 'orders', orderId);
    unsubscribe = onSnapshot(orderRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const status = data.status;
        const statusText = document.getElementById('statusText');
        const confirmBtn = document.getElementById('confirmBtn');
        
        if (status === 'paid') {
          statusText.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Pembayaran diterima! Mengarahkan...';
          setTimeout(() => { window.location.href = `/done.html?orderId=${orderId}`; }, 2000);
        } else if (status === 'delivered') {
          window.location.href = `/done.html?orderId=${orderId}`;
        } else if (status === 'cancelled') {
          statusText.innerHTML = '<i class="fas fa-times-circle"></i> ❌ Pesanan dibatalkan';
          confirmBtn.disabled = true;
        } else if (status === 'pending_verification') {
          statusText.innerHTML = '<i class="fas fa-clock"></i> ⏳ Menunggu verifikasi admin...';
          confirmBtn.disabled = true;
          confirmBtn.innerHTML = '<i class="fas fa-hourglass-half"></i> Menunggu Admin';
        }
        
        const expireAt = data.expireAt?.toDate();
        if (expireAt && expireAt > new Date() && (status === 'waiting_payment' || status === 'pending_verification')) {
          startTimer(expireAt);
        }
      }
    });
  }

  async function loadOrder() {
    try {
      const orderRef = doc(db, 'orders', orderId);
      const orderSnap = await getDoc(orderRef);
      
      if (!orderSnap.exists()) {
        alert('Pesanan tidak ditemukan');
        window.location.href = 'index.html';
        return;
      }
      
      const data = orderSnap.data();
      
      if (data.status === 'paid' || data.status === 'delivered') {
        window.location.href = `/done.html?orderId=${orderId}`;
        return;
      }
      
      if (data.status === 'cancelled') {
        alert('Pesanan dibatalkan');
        window.location.href = 'index.html';
        return;
      }
      
      currentAmount = data.totalWithUnique || data.totalPrice;
      await generateQRIS();
      listenOrderStatus();
      
    } catch (error) {
      console.error('Error:', error);
    }
  }

  document.getElementById('confirmBtn').addEventListener('click', confirmPayment);
  loadOrder();
</script>
</body>
</html>
