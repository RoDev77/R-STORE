<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Statistik - Admin R STORE</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a14;
      color: #fff;
      overflow-x: hidden;
    }
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(10,10,20,0.95);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; }
    .nav-logo i { color: #667eea; }
    .btn-back {
      background: rgba(102,126,234,0.2);
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 90px 20px 40px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, rgba(102,126,234,0.12), rgba(118,75,162,0.08));
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(102,126,234,0.15);
    }
    .stat-card h3 {
      font-size: 13px;
      color: #a0a0b0;
      margin-bottom: 10px;
    }
    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: #667eea;
    }
    .stat-change {
      font-size: 12px;
      margin-top: 8px;
    }
    .stat-change.positive { color: #28a745; }
    .stat-change.negative { color: #dc3545; }
    .chart-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .chart-card {
      background: #13132a;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .chart-card h3 {
      font-size: 16px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-card canvas {
      max-height: 300px;
    }
    .export-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-export {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-export:hover { transform: translateY(-2px); }
    .report-select {
      background: #1e1e34;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .chart-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo"><i class="fas fa-chart-line"></i><span>Dashboard Admin</span></div>
    <a href="admin.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Admin</a>
  </div>
</nav>

<div class="container">
  <div class="export-buttons">
    <select id="reportPeriod" class="report-select">
      <option value="daily">📅 Daily Report</option>
      <option value="weekly">📊 Weekly Report</option>
      <option value="monthly">📈 Monthly Report</option>
    </select>
    <button id="generateReportBtn" class="btn-export"><i class="fas fa-file-alt"></i> Generate Report</button>
    <button id="exportOrdersBtn" class="btn-export"><i class="fas fa-file-excel"></i> Export Orders (CSV)</button>
    <button id="exportUsersBtn" class="btn-export"><i class="fas fa-file-excel"></i> Export Users (CSV)</button>
    <button id="exportReferralsBtn" class="btn-export"><i class="fas fa-file-excel"></i> Export Referrals (CSV)</button>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><h3>Total Pesanan</h3><div class="stat-number" id="totalOrders">0</div><div class="stat-change" id="ordersChange"></div></div>
    <div class="stat-card"><h3>Total Pendapatan</h3><div class="stat-number" id="totalRevenue">Rp 0</div><div class="stat-change" id="revenueChange"></div></div>
    <div class="stat-card"><h3>Total User</h3><div class="stat-number" id="totalUsers">0</div><div class="stat-change" id="usersChange"></div></div>
    <div class="stat-card"><h3>Total Referral</h3><div class="stat-number" id="totalReferrals">0</div><div class="stat-change" id="referralsChange"></div></div>
  </div>

  <div class="chart-row">
    <div class="chart-card">
      <h3><i class="fas fa-chart-line"></i> Penjualan 7 Hari Terakhir</h3>
      <canvas id="salesChart"></canvas>
    </div>
    <div class="chart-card">
      <h3><i class="fas fa-users"></i> User Growth</h3>
      <canvas id="userGrowthChart"></canvas>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, query, getDocs, where, orderBy, limit } from './firebase-config.js';
  import { isDiscordLoggedIn, getDiscordUser } from './js/discord-auth.js';

  let salesChart, userGrowthChart;

  async function loadStatistics() {
    // Load orders
    const ordersSnap = await getDocs(collection(db, 'orders'));
    const depositSnap = await getDocs(collection(db, 'deposit_orders'));
    const usersSnap = await getDocs(collection(db, 'users'));
    const referralsSnap = await getDocs(collection(db, 'referrals'));
    
    const totalOrders = ordersSnap.size + depositSnap.size;
    let totalRevenue = 0;
    ordersSnap.forEach(doc => { totalRevenue += doc.data().totalPrice || 0; });
    depositSnap.forEach(doc => { totalRevenue += doc.data().amount || 0; });
    
    document.getElementById('totalOrders').textContent = totalOrders;
    document.getElementById('totalRevenue').textContent = `Rp ${totalRevenue.toLocaleString('id-ID')}`;
    document.getElementById('totalUsers').textContent = usersSnap.size;
    
    let totalReferrals = 0;
    referralsSnap.forEach(doc => { totalReferrals += doc.data().totalReferred || 0; });
    document.getElementById('totalReferrals').textContent = totalReferrals;
    
    // Load sales chart data (last 7 days)
    const last7Days = [];
    const salesData = [];
    for (let i = 6; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);
      last7Days.push(date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }));
      
      let dailyTotal = 0;
      const startOfDay = new Date(date.setHours(0,0,0,0));
      const endOfDay = new Date(date.setHours(23,59,59,999));
      
      for (const doc of ordersSnap.docs) {
        const createdAt = doc.data().createdAt?.toDate();
        if (createdAt && createdAt >= startOfDay && createdAt <= endOfDay) {
          dailyTotal += doc.data().totalPrice || 0;
        }
      }
      for (const doc of depositSnap.docs) {
        const createdAt = doc.data().createdAt?.toDate();
        if (createdAt && createdAt >= startOfDay && createdAt <= endOfDay) {
          dailyTotal += doc.data().amount || 0;
        }
      }
      salesData.push(dailyTotal);
    }
    
    if (salesChart) salesChart.destroy();
    salesChart = new Chart(document.getElementById('salesChart'), {
      type: 'line',
      data: { labels: last7Days, datasets: [{ label: 'Pendapatan (Rp)', data: salesData, borderColor: '#667eea', backgroundColor: 'rgba(102,126,234,0.1)', fill: true }] },
      options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { y: { ticks: { color: '#a0a0b0' } }, x: { ticks: { color: '#a0a0b0' } } } }
    });
    
    // User growth chart
    const userGrowth = [];
    const userLabels = [];
    for (let i = 6; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);
      userLabels.push(date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }));
      
      let count = 0;
      const endOfDay = new Date(date.setHours(23,59,59,999));
      for (const doc of usersSnap.docs) {
        const createdAt = doc.data().createdAt?.toDate();
        if (createdAt && createdAt <= endOfDay) count++;
      }
      userGrowth.push(count);
    }
    
    if (userGrowthChart) userGrowthChart.destroy();
    userGrowthChart = new Chart(document.getElementById('userGrowthChart'), {
      type: 'bar',
      data: { labels: userLabels, datasets: [{ label: 'Total User', data: userGrowth, backgroundColor: '#764ba2', borderRadius: 8 }] },
      options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { y: { ticks: { color: '#a0a0b0' } }, x: { ticks: { color: '#a0a0b0' } } } }
    });
  }
  
  async function exportToCSV(data, filename) {
    const headers = Object.keys(data[0]);
    const csvRows = [headers.join(',')];
    for (const row of data) {
      const values = headers.map(header => `"${(row[header] || '').toString().replace(/"/g, '""')}"`);
      csvRows.push(values.join(','));
    }
    const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filename}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
  
  document.getElementById('exportOrdersBtn').onclick = async () => {
    const ordersSnap = await getDocs(collection(db, 'orders'));
    const orders = [];
    ordersSnap.forEach(doc => { orders.push({ id: doc.id, ...doc.data() }); });
    exportToCSV(orders, `orders_${new Date().toISOString().split('T')[0]}`);
  };
  
  document.getElementById('exportUsersBtn').onclick = async () => {
    const usersSnap = await getDocs(collection(db, 'users'));
    const users = [];
    usersSnap.forEach(doc => { users.push({ discordId: doc.id, ...doc.data() }); });
    exportToCSV(users, `users_${new Date().toISOString().split('T')[0]}`);
  };
  
  document.getElementById('exportReferralsBtn').onclick = async () => {
    const referralsSnap = await getDocs(collection(db, 'referrals'));
    const referrals = [];
    referralsSnap.forEach(doc => { referrals.push({ id: doc.id, ...doc.data() }); });
    exportToCSV(referrals, `referrals_${new Date().toISOString().split('T')[0]}`);
  };
  
  document.getElementById('generateReportBtn').onclick = () => {
    const period = document.getElementById('reportPeriod').value;
    alert(`📊 Report ${period} akan dikirim ke email admin dalam 5 menit.\nFitur ini sedang dalam pengembangan.`);
  };
  
  loadStatistics();
</script>
</body>
</html>
