<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - R STORE</title>
  <meta name="description" content="Admin panel untuk mengelola toko R STORE" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #fff;
      overflow-x: hidden;
    }

    /* Loading Screen */
    .loading-screen-init {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .loading-spinner-init {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(102,126,234,0.3);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-box {
      background: #13132a;
      padding: 50px;
      border-radius: 32px;
      width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .login-box h2 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #667eea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
    }

    .discord-login-btn {
      background: #5865F2;
      width: 100%;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      color: white;
      transition: all 0.3s;
    }

    .discord-login-btn:hover {
      background: #4752C4;
      transform: translateY(-2px);
    }

    .error-msg { color: #dc3545; margin-top: 15px; display: none; font-size: 14px; }
    .loading-msg { color: #667eea; margin-top: 15px; display: none; font-size: 14px; }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
    }

    .nav-logo i, .nav-logo span {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-buttons { display: flex; gap: 15px; align-items: center; }
    .btn-nav {
      background: rgba(102,126,234,0.2);
      color: #667eea;
      padding: 8px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout { background: rgba(220, 53, 69, 0.2); color: #dc3545; }

    .admin-content { display: none; padding-top: 80px; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 30px; }
    .card { background: #13132a; border-radius: 24px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
    .card h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .card h2 i { color: #667eea; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(118,75,162,0.15));
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .stat-number { font-size: 36px; font-weight: 800; color: #667eea; }
    .stat-label { font-size: 12px; color: #a0a0b0; margin-top: 5px; }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .setting-item { display: flex; flex-direction: column; gap: 8px; }
    .setting-item label { font-size: 13px; color: #a0a0b0; }
    .setting-item input {
      background: #1a1a30;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      color: white;
    }
    .btn-save {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      background: #1a1a30;
      border-radius: 40px;
      padding: 0 16px;
    }
    .filter-group select, .filter-group input {
      background: transparent;
      border: none;
      padding: 12px;
      color: white;
      outline: none;
    }
    .btn-refresh {
      background: rgba(102,126,234,0.2);
      border: none;
      color: #667eea;
      padding: 0 20px;
      border-radius: 40px;
      cursor: pointer;
    }

    .order-item {
      background: #1a1a30;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s;
    }

    .order-item:hover {
      border-color: rgba(102,126,234,0.3);
      transform: translateX(5px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .order-id {
      font-family: monospace;
      background: rgba(102,126,234,0.15);
      padding: 4px 12px;
      border-radius: 20px;
      color: #667eea;
      font-size: 12px;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .order-detail-label { font-size: 11px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 0.5px; }
    .order-detail-value { font-size: 14px; font-weight: 600; }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-waiting_payment { background: #ffc107; color: #000; }
    .status-pending_verification { background: #fd7e14; color: #fff; }
    .status-paid { background: #28a745; color: #fff; }
    .status-delivered { background: #17a2b8; color: #fff; }
    .status-cancelled { background: #dc3545; color: #fff; }

    /* 🔥 JENIS PENGIRIMAN - TAMPIL LEBIH MENONJOL */
    .delivery-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
    }
    .delivery-instant { 
      background: rgba(40, 167, 69, 0.2); 
      color: #28a745; 
      border: 1px solid rgba(40, 167, 69, 0.3);
    }
    .delivery-po { 
      background: rgba(255, 193, 7, 0.2); 
      color: #ffc107; 
      border: 1px solid rgba(255, 193, 7, 0.3);
    }
    .delivery-delayed { 
      background: rgba(255, 193, 7, 0.2); 
      color: #ffc107; 
      border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .order-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-top: 15px; 
      padding-top: 15px; 
      border-top: 1px solid rgba(255,255,255,0.1); 
    }
    .btn-status { 
      padding: 6px 14px; 
      border-radius: 30px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      border: none; 
      transition: all 0.2s;
    }
    .btn-status:hover { transform: translateY(-2px); }
    .btn-paid { background: #28a745; color: white; }
    .btn-delivered { background: #17a2b8; color: white; }
    .btn-cancel { background: #dc3545; color: white; }
    .btn-verify { background: #fd7e14; color: white; }

    select.status-select {
      background: #1a1a30;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 6px 14px;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .timer-display { font-size: 11px; color: #ffc107; margin-top: 8px; padding: 5px 10px; background: rgba(255,193,7,0.1); border-radius: 20px; display: inline-block; }
    .empty-state { text-align: center; padding: 60px; color: #a0a0b0; }
    .admin-user-info { margin-left: 15px; font-size: 14px; color: #667eea; display: flex; align-items: center; gap: 8px; }

    .footer { text-align: center; padding: 30px; border-top: 1px solid rgba(255,255,255,0.1); color: #a0a0b0; font-size: 12px; }
    
    @media (max-width: 768px) { 
      .nav-container { flex-direction: column; gap: 15px; } 
      .container { padding: 15px; } 
      .card { padding: 20px; } 
      .login-box { margin: 20px; padding: 30px; width: auto; }
      .order-header { flex-direction: column; align-items: flex-start; }
      .order-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Initial Loading Screen -->
<div class="loading-screen-init" id="initialLoading">
  <div style="text-align: center;">
    <div class="loading-spinner-init"></div>
    <p>Memeriksa sesi admin...</p>
  </div>
</div>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen" style="display: none;">
  <div class="login-box">
    <h2>🔐 Admin Login</h2>
    
    <button id="discordAdminLogin" class="discord-login-btn">
      <i class="fab fa-discord"></i> Login dengan Discord
    </button>
    
    <div class="loading-msg" id="loadingMsg">⏳ Memeriksa...</div>
    <div class="error-msg" id="loginError">❌ Anda tidak memiliki akses admin!</div>
  </div>
</div>

<!-- Admin Content -->
<div class="admin-content" id="adminContent" style="display: none;">
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo"><i class="fas fa-shield-alt"></i><span>R STORE</span></div>
      <div class="nav-buttons">
        <span id="adminUserInfo" class="admin-user-info"></span>
        <button id="adminLogoutBtn" class="btn-nav btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-number" id="statWaiting">0</div><div class="stat-label">💳 Menunggu Bayar</div></div>
      <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">⏰ Verifikasi</div></div>
      <div class="stat-card"><div class="stat-number" id="statPaid">0</div><div class="stat-label">✅ Dibayar</div></div>
      <div class="stat-card"><div class="stat-number" id="statDelivered">0</div><div class="stat-label">🎉 Terkirim</div></div>
      <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">📦 Total Order</div></div>
    </div>

    <div class="card">
      <h2><i class="fas fa-sliders-h"></i> Pengaturan Toko</h2>
      <div class="settings-grid">
        <div class="setting-item"><label>💰 Harga per Robux (Rp)</label><input type="number" id="adminPrice" value="150" /></div>
        <div class="setting-item"><label>📦 Stock Ready (Instant)</label><input type="number" id="adminStock" value="100" /></div>
        <div class="setting-item"><label>📅 Pre-Order Available</label><input type="number" id="adminPO" value="50" /></div>
        <div class="setting-item"><label>📊 PO Limit</label><input type="number" id="adminPOLimit" value="100" /></div>
      </div>
      <button id="saveSettingsBtn" class="btn-save"><i class="fas fa-save"></i> Simpan</button>
      <span id="saveFeedback" class="save-feedback"></span>
    </div>

    <div class="card">
      <div class="filter-bar">
        <div class="filter-group"><i class="fas fa-filter"></i><select id="statusFilter">
          <option value="all">Semua Status</option><option value="waiting_payment">💳 Menunggu Bayar</option>
          <option value="pending_verification">⏰ Verifikasi</option><option value="paid">✅ Dibayar</option>
          <option value="delivered">🎉 Terkirim</option><option value="cancelled">❌ Dibatalkan</option>
        </select></div>
        <div class="filter-group"><i class="fas fa-search"></i><input type="text" id="searchOrder" placeholder="Cari Order ID..." /></div>
        <button id="refreshOrders" class="btn-refresh"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="ordersList"><div class="empty-state"><i class="fas fa-inbox"></i><p>Loading pesanan...</p></div></div>
    </div>
  </div>
  <footer class="footer"><p>&copy; 2025 R STORE — Unofficial Roblox Store</p></footer>
</div>

<script type="module">
  import { db, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, onSnapshot } from './firebase-config.js';

  const CONFIG_ID = 'storeSettings';
  let allOrders = [], unsubscribe = null;
  let sessionCheckInterval = null;
  
  // SESSION KEYS - SAMA DENGAN index.html
  const DISCORD_LOGIN_URL = '/api/discord-login';
  const JWT_TOKEN_KEY = 'discord_session_token';
  const DISCORD_USER_KEY = 'discord_user';

  // DOM Elements
  const initialLoading = document.getElementById('initialLoading');
  const loginScreen = document.getElementById('loginScreen');
  const adminContent = document.getElementById('adminContent');
  const discordAdminLogin = document.getElementById('discordAdminLogin');
  const adminLogoutBtn = document.getElementById('adminLogoutBtn');
  const adminUserInfo = document.getElementById('adminUserInfo');

  // ========== FUNGSI SHARED SESSION ==========
  function isDiscordLoggedIn() {
    const token = localStorage.getItem(JWT_TOKEN_KEY);
    const user = localStorage.getItem(DISCORD_USER_KEY);
    return token && user;
  }

  function getDiscordUser() {
    const user = localStorage.getItem(DISCORD_USER_KEY);
    return user ? JSON.parse(user) : null;
  }

  function isUserAdmin(user) {
    return user && user.role === 'admin';
  }

  function loginWithDiscord() {
    window.location.href = DISCORD_LOGIN_URL;
  }

  function logoutDiscord() {
    localStorage.removeItem(JWT_TOKEN_KEY);
    localStorage.removeItem(DISCORD_USER_KEY);
    showLoginScreen();
    window.location.href = '/';
  }

  function checkDiscordCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('discord_token');
    const userData = urlParams.get('user');
    const error = urlParams.get('error');
    
    if (error) {
      console.error('Discord login error:', error);
      showError('Login Discord gagal!');
      return false;
    }
    
    if (sessionToken && userData) {
      try {
        const user = JSON.parse(decodeURIComponent(userData));
        localStorage.setItem(JWT_TOKEN_KEY, sessionToken);
        localStorage.setItem(DISCORD_USER_KEY, JSON.stringify(user));
        window.history.replaceState({}, document.title, window.location.pathname);
        
        if (user.role === 'admin') {
          return true;
        } else {
          showError('Anda tidak memiliki akses admin!');
          localStorage.removeItem(JWT_TOKEN_KEY);
          localStorage.removeItem(DISCORD_USER_KEY);
          return false;
        }
      } catch (e) {
        console.error('Error parsing user data:', e);
        showError('Gagal memproses login');
        return false;
      }
    }
    return false;
  }

  function showError(message) {
    const errorDiv = document.getElementById('loginError');
    if (errorDiv) {
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 3000);
    }
  }

  function hideInitialLoading() {
    if (initialLoading) initialLoading.style.display = 'none';
  }

  function showAdminContent() {
    if (loginScreen) loginScreen.style.display = 'none';
    if (adminContent) adminContent.style.display = 'block';
    if (initialLoading) initialLoading.style.display = 'none';
  }

  function showLoginScreen() {
    if (loginScreen) loginScreen.style.display = 'flex';
    if (adminContent) adminContent.style.display = 'none';
    if (initialLoading) initialLoading.style.display = 'none';
    if (unsubscribe) unsubscribe();
    if (sessionCheckInterval) clearInterval(sessionCheckInterval);
  }

  async function checkAuth() {
    if (checkDiscordCallback()) {
      const user = getDiscordUser();
      if (user && isUserAdmin(user)) {
        showAdminContent();
        await loadSettings();
        listenOrders();
        startSessionCheck();
        updateAdminUserInfo(user);
        return;
      } else {
        showLoginScreen();
        hideInitialLoading();
        return;
      }
    }
    
    if (isDiscordLoggedIn()) {
      const user = getDiscordUser();
      try {
        const userDoc = await getDoc(doc(db, 'users', `discord_${user.id}`));
        if (userDoc.exists()) {
          const userData = userDoc.data();
          if (userData.role === 'admin') {
            if (user.role !== 'admin') {
              user.role = 'admin';
              localStorage.setItem(DISCORD_USER_KEY, JSON.stringify(user));
            }
            showAdminContent();
            await loadSettings();
            listenOrders();
            startSessionCheck();
            updateAdminUserInfo(user);
            hideInitialLoading();
            return;
          }
        }
      } catch (error) {
        console.error('Error verifying admin role:', error);
      }
      
      if (user && isUserAdmin(user)) {
        showAdminContent();
        await loadSettings();
        listenOrders();
        startSessionCheck();
        updateAdminUserInfo(user);
        hideInitialLoading();
        return;
      }
    }
    
    showLoginScreen();
    hideInitialLoading();
  }

  function updateAdminUserInfo(user) {
    if (adminUserInfo && user) {
      const avatarUrl = user.avatar 
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=32`
        : `https://cdn.discordapp.com/embed/avatars/${parseInt(user.id) % 5}.png`;
      adminUserInfo.innerHTML = `<img src="${avatarUrl}" style="width:28px;height:28px;border-radius:50%;margin-right:8px;"> ${user.globalName || user.username} (Admin)`;
    }
  }

  function startSessionCheck() {
    if (sessionCheckInterval) clearInterval(sessionCheckInterval);
    sessionCheckInterval = setInterval(() => {
      if (!isDiscordLoggedIn()) {
        console.log('Session expired, redirecting to login...');
        showLoginScreen();
        if (unsubscribe) unsubscribe();
      }
    }, 30 * 60 * 1000);
  }

  if (discordAdminLogin) {
    discordAdminLogin.onclick = () => {
      const loadingMsg = document.getElementById('loadingMsg');
      if (loadingMsg) loadingMsg.style.display = 'block';
      loginWithDiscord();
    };
  }

  if (adminLogoutBtn) {
    adminLogoutBtn.onclick = () => {
      logoutDiscord();
    };
  }

  async function loadSettings() {
    const snap = await getDoc(doc(db, 'config', CONFIG_ID));
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById('adminPrice').value = d.pricePerRobux || 150;
      document.getElementById('adminStock').value = d.currentStock || 100;
      document.getElementById('adminPO').value = d.currentPO || 50;
      document.getElementById('adminPOLimit').value = d.poLimit || 100;
    }
  }

  document.getElementById('saveSettingsBtn').onclick = async () => {
    await setDoc(doc(db, 'config', CONFIG_ID), {
      pricePerRobux: parseInt(document.getElementById('adminPrice').value),
      currentStock: parseInt(document.getElementById('adminStock').value),
      currentPO: parseInt(document.getElementById('adminPO').value),
      poLimit: parseInt(document.getElementById('adminPOLimit').value),
      updatedAt: new Date()
    });
    const fb = document.getElementById('saveFeedback');
    fb.textContent = '✅ Tersimpan!';
    setTimeout(() => fb.textContent = '', 2000);
  };

  function updateStats(orders) {
    document.getElementById('statWaiting').textContent = orders.filter(o => o.status === 'waiting_payment').length;
    document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending_verification').length;
    document.getElementById('statPaid').textContent = orders.filter(o => o.status === 'paid').length;
    document.getElementById('statDelivered').textContent = orders.filter(o => o.status === 'delivered').length;
    document.getElementById('statTotal').textContent = orders.length;
  }

  function listenOrders() {
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(q, (snapshot) => {
      allOrders = [];
      snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
      updateStats(allOrders);
      applyFilterAndSearch();
    });
  }

  function formatDate(dateValue) {
    if (!dateValue) return '-';
    try { if (dateValue?.toDate) return dateValue.toDate().toLocaleString('id-ID'); }
    catch { return '-'; }
    return '-';
  }

  function getExpireTimeLeft(expireAt, status) {
    if (status !== 'waiting_payment') return '';
    if (!expireAt) return '';
    try {
      const expDate = expireAt.toDate ? expireAt.toDate() : new Date(expireAt);
      const remaining = Math.max(0, Math.floor((expDate - new Date()) / 1000));
      const minutes = Math.floor(remaining / 60);
      const hours = Math.floor(minutes / 60);
      if (remaining <= 0) return '⏰ Expired';
      if (hours > 0) return `⏱️ ${hours}j ${minutes % 60}m`;
      if (minutes > 0) return `⏱️ ${minutes}m ${remaining % 60}d`;
      return `⏱️ ${remaining}d`;
    } catch { return ''; }
  }

  function getMethodName(method) {
    const names = { bca: 'BCA VA', mandiri: 'Mandiri VA', bni: 'BNI VA', bri: 'BRI VA', qris: 'QRIS' };
    return names[method] || method?.toUpperCase() || '-';
  }

  async function updateOrderStatus(orderId, newStatus) {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus, updatedAt: new Date() });
  }

  function applyFilterAndSearch() {
    const status = document.getElementById('statusFilter')?.value || 'all';
    const search = document.getElementById('searchOrder')?.value?.toLowerCase() || '';
    let filtered = [...allOrders];
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    if (search) filtered = filtered.filter(o => o.id.toLowerCase().includes(search));
    renderOrders(filtered);
  }

  // 🔥 FUNGSI UNTUK MENDAPATKAN JENIS PENGIRIMAN DARI DELIVERY INFO
  function getDeliveryType(deliveryInfo) {
    if (!deliveryInfo) return { type: 'instant', text: '⚡ Instant', icon: 'fa-bolt', class: 'delivery-instant' };
    if (deliveryInfo.includes('PO') || deliveryInfo.includes('Pre-Order') || deliveryInfo.includes('📦')) {
      return { type: 'po', text: '📦 Pre-Order (15 Hari)', icon: 'fa-calendar-alt', class: 'delivery-po' };
    }
    if (deliveryInfo.includes('Ditunda') || deliveryInfo.includes('⏸️') || deliveryInfo.includes('delayed')) {
      return { type: 'delayed', text: '⏸️ Ditunda', icon: 'fa-pause-circle', class: 'delivery-delayed' };
    }
    if (deliveryInfo.includes('Instant') || deliveryInfo.includes('⚡')) {
      return { type: 'instant', text: '⚡ Instant', icon: 'fa-bolt', class: 'delivery-instant' };
    }
    return { type: 'instant', text: '⚡ Instant', icon: 'fa-bolt', class: 'delivery-instant' };
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!container) return;
    if (orders.length === 0) { 
      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>✨ Tidak ada pesanan</p></div>'; 
      return; 
    }
    
    container.innerHTML = orders.map(order => {
      let statusClass = 'status-waiting_payment', statusText = '💳 Menunggu Bayar';
      if (order.status === 'pending_verification') { statusClass = 'status-pending_verification'; statusText = '⏰ Menunggu Verifikasi'; }
      else if (order.status === 'paid') { statusClass = 'status-paid'; statusText = '✅ Dibayar'; }
      else if (order.status === 'delivered') { statusClass = 'status-delivered'; statusText = '🎉 Terkirim'; }
      else if (order.status === 'cancelled') { statusClass = 'status-cancelled'; statusText = '❌ Dibatalkan'; }
      
      // 🔥 GET DELIVERY TYPE
      const delivery = getDeliveryType(order.deliveryInfo);
      const timerHtml = getExpireTimeLeft(order.expireAt, order.status);
      
      return `
        <div class="order-item">
          <div class="order-header">
            <div>
              <span class="order-id"><i class="fas fa-hashtag"></i> ${order.id}</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <span class="delivery-badge ${delivery.class}">
                <i class="fas ${delivery.icon}"></i> ${delivery.text}
              </span>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
          </div>
          
          <div class="order-details">
            <div>
              <div class="order-detail-label"><i class="fas fa-rocket"></i> Username</div>
              <div class="order-detail-value">${order.robloxUsername || '-'}</div>
            </div>
            <div>
              <div class="order-detail-label"><i class="fas fa-coins"></i> Robux</div>
              <div class="order-detail-value">${(order.robuxAmount || 0).toLocaleString()}</div>
            </div>
            <div>
              <div class="order-detail-label"><i class="fas fa-money-bill"></i> Total</div>
              <div class="order-detail-value">Rp ${(order.totalPrice || 0).toLocaleString()}</div>
            </div>
            <div>
              <div class="order-detail-label"><i class="fas fa-credit-card"></i> Metode</div>
              <div class="order-detail-value">${getMethodName(order.paymentMethod)}</div>
            </div>
            <div>
              <div class="order-detail-label"><i class="fas fa-code"></i> Kode Unik</div>
              <div class="order-detail-value" style="color:#ffc107">${order.uniqueCode || '-'}</div>
            </div>
            <div>
              <div class="order-detail-label"><i class="fas fa-calendar"></i> Dibuat</div>
              <div class="order-detail-value">${formatDate(order.createdAt)}</div>
            </div>
          </div>
          
          ${timerHtml ? `<div class="timer-display"><i class="fas fa-hourglass-half"></i> ${timerHtml}</div>` : ''}
          
          <div class="order-actions">
            <select class="status-select" data-id="${order.id}">
              <option value="waiting_payment" ${order.status === 'waiting_payment' ? 'selected' : ''}>💳 Menunggu Bayar</option>
              <option value="pending_verification" ${order.status === 'pending_verification' ? 'selected' : ''}>⏰ Verifikasi</option>
              <option value="paid" ${order.status === 'paid' ? 'selected' : ''}>✅ Paid</option>
              <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>🎉 Delivered</option>
              <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Cancel</option>
            </select>
            <button class="btn-status btn-paid" data-id="${order.id}" data-status="paid">✅ Paid</button>
            <button class="btn-status btn-delivered" data-id="${order.id}" data-status="delivered">🎉 Delivered</button>
            <button class="btn-status btn-cancel" data-id="${order.id}" data-status="cancelled">❌ Cancel</button>
            ${order.status === 'pending_verification' ? `<button class="btn-status btn-verify" data-id="${order.id}" data-status="paid">✅ Verifikasi</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
    
    document.querySelectorAll('.status-select').forEach(s => s.onchange = (e) => updateOrderStatus(e.target.dataset.id, e.target.value));
    document.querySelectorAll('.btn-status').forEach(b => b.onclick = () => updateOrderStatus(b.dataset.id, b.dataset.status));
  }

  document.getElementById('statusFilter')?.addEventListener('change', () => applyFilterAndSearch());
  document.getElementById('searchOrder')?.addEventListener('input', () => applyFilterAndSearch());
  document.getElementById('refreshOrders')?.addEventListener('click', () => applyFilterAndSearch());

  checkAuth();
</script>
</body>
</html>
