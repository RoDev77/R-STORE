<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - R STORE</title>
  <meta name="description" content="Admin panel untuk mengelola toko R STORE" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #fff;
      overflow-x: hidden;
    }

    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-box {
      background: #13132a;
      padding: 50px;
      border-radius: 32px;
      width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .login-box h2 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #667eea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
    }

    .discord-login-btn {
      background: #5865F2;
      width: 100%;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      color: white;
      transition: all 0.3s;
    }

    .discord-login-btn:hover {
      background: #4752C4;
      transform: translateY(-2px);
    }

    .error-msg { color: #dc3545; margin-top: 15px; display: none; font-size: 14px; }
    .loading-msg { color: #667eea; margin-top: 15px; display: none; font-size: 14px; }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
    }

    .nav-logo i, .nav-logo span {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-buttons { display: flex; gap: 15px; align-items: center; }
    .btn-nav {
      background: rgba(102,126,234,0.2);
      color: #667eea;
      padding: 8px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout { background: rgba(220, 53, 69, 0.2); color: #dc3545; }

    .admin-content { display: none; padding-top: 80px; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 30px; }
    .card { background: #13132a; border-radius: 24px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
    .card h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .card h2 i { color: #667eea; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(118,75,162,0.15));
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .stat-number { font-size: 36px; font-weight: 800; color: #667eea; }
    .stat-label { font-size: 12px; color: #a0a0b0; margin-top: 5px; }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .setting-item { display: flex; flex-direction: column; gap: 8px; }
    .setting-item label { font-size: 13px; color: #a0a0b0; }
    .setting-item input {
      background: #1a1a30;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      color: white;
    }
    .btn-save {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      background: #1a1a30;
      border-radius: 40px;
      padding: 0 16px;
    }
    .filter-group select, .filter-group input {
      background: transparent;
      border: none;
      padding: 12px;
      color: white;
      outline: none;
    }
    .btn-refresh {
      background: rgba(102,126,234,0.2);
      border: none;
      color: #667eea;
      padding: 0 20px;
      border-radius: 40px;
      cursor: pointer;
    }

    .order-item {
      background: #1a1a30;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .order-id {
      font-family: monospace;
      background: rgba(102,126,234,0.15);
      padding: 4px 12px;
      border-radius: 20px;
      color: #667eea;
    }
    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .order-detail-label { font-size: 11px; color: #a0a0b0; text-transform: uppercase; }
    .order-detail-value { font-size: 15px; font-weight: 600; }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-waiting_payment { background: #ffc107; color: #000; }
    .status-pending_verification { background: #fd7e14; color: #fff; }
    .status-paid { background: #28a745; color: #fff; }
    .status-delivered { background: #17a2b8; color: #fff; }
    .status-cancelled { background: #dc3545; color: #fff; }

    .delivery-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .delivery-instant { background: rgba(40,167,69,0.2); color: #28a745; }
    .delivery-po { background: rgba(255,193,7,0.2); color: #ffc107; }
    .delivery-delayed { background: rgba(255,193,7,0.2); color: #ffc107; }

    .order-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
    .btn-status { padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-paid { background: #28a745; color: white; }
    .btn-delivered { background: #17a2b8; color: white; }
    .btn-cancel { background: #dc3545; color: white; }
    .btn-verify { background: #fd7e14; color: white; }

    select.status-select {
      background: #1a1a30;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 8px 16px;
      color: white;
    }

    .timer-display { font-size: 11px; color: #ffc107; margin-top: 4px; }
    .empty-state { text-align: center; padding: 60px; color: #a0a0b0; }
    .admin-user-info { margin-left: 15px; font-size: 14px; color: #667eea; }

    .footer { text-align: center; padding: 30px; border-top: 1px solid rgba(255,255,255,0.1); color: #a0a0b0; }
    
    @media (max-width: 768px) { 
      .nav-container { flex-direction: column; gap: 15px; } 
      .container { padding: 15px; } 
      .card { padding: 20px; } 
      .login-box { margin: 20px; padding: 30px; width: auto; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>🔐 Admin Login</h2>
    
    <button id="discordAdminLogin" class="discord-login-btn">
      <i class="fab fa-discord"></i> Login dengan Discord
    </button>
    
    <div class="loading-msg" id="loadingMsg">⏳ Memeriksa...</div>
    <div class="error-msg" id="loginError">❌ Anda tidak memiliki akses admin!</div>
  </div>
</div>

<!-- Admin Content -->
<div class="admin-content" id="adminContent">
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo"><i class="fas fa-shield-alt"></i><span>R STORE</span></div>
      <div class="nav-buttons">
        <span id="adminUserInfo" class="admin-user-info"></span>
        <button id="adminLogoutBtn" class="btn-nav btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-number" id="statWaiting">0</div><div class="stat-label">💳 Menunggu Bayar</div></div>
      <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">⏰ Verifikasi</div></div>
      <div class="stat-card"><div class="stat-number" id="statPaid">0</div><div class="stat-label">✅ Dibayar</div></div>
      <div class="stat-card"><div class="stat-number" id="statDelivered">0</div><div class="stat-label">🎉 Terkirim</div></div>
      <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">📦 Total Order</div></div>
    </div>

    <!-- Settings Card -->
    <div class="card">
      <h2><i class="fas fa-sliders-h"></i> Pengaturan Toko</h2>
      <div class="settings-grid">
        <div class="setting-item"><label>💰 Harga per Robux (Rp)</label><input type="number" id="adminPrice" value="150" /></div>
        <div class="setting-item"><label>📦 Stock Ready (Instant)</label><input type="number" id="adminStock" value="100" /></div>
        <div class="setting-item"><label>📅 Pre-Order Available</label><input type="number" id="adminPO" value="50" /></div>
        <div class="setting-item"><label>📊 PO Limit</label><input type="number" id="adminPOLimit" value="100" /></div>
      </div>
      <button id="saveSettingsBtn" class="btn-save"><i class="fas fa-save"></i> Simpan</button>
      <span id="saveFeedback" class="save-feedback"></span>
    </div>

    <!-- Orders Card -->
    <div class="card">
      <div class="filter-bar">
        <div class="filter-group"><i class="fas fa-filter"></i><select id="statusFilter">
          <option value="all">Semua Status</option><option value="waiting_payment">💳 Menunggu Bayar</option>
          <option value="pending_verification">⏰ Verifikasi</option><option value="paid">✅ Dibayar</option>
          <option value="delivered">🎉 Terkirim</option><option value="cancelled">❌ Dibatalkan</option>
        </select></div>
        <div class="filter-group"><i class="fas fa-search"></i><input type="text" id="searchOrder" placeholder="Cari Order ID..." /></div>
        <button id="refreshOrders" class="btn-refresh"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="ordersList"><div class="empty-state"><i class="fas fa-inbox"></i><p>Loading pesanan...</p></div></div>
    </div>
  </div>
  <footer class="footer"><p>&copy; 2025 R STORE — Unofficial Roblox Store</p></footer>
</div>

<script type="module">
  import { db, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, onSnapshot } from './firebase-config.js';

  const CONFIG_ID = 'storeSettings';
  let allOrders = [], unsubscribe = null;
  
  // Discord login URL
  const DISCORD_LOGIN_URL = '/api/discord-login';
  const JWT_TOKEN_KEY = 'admin_session_token';
  const ADMIN_USER_KEY = 'admin_user';

  // ========== FUNGSI DISCORD LOGIN ==========
  function isDiscordLoggedIn() {
    const token = localStorage.getItem(JWT_TOKEN_KEY);
    const user = localStorage.getItem(ADMIN_USER_KEY);
    return token && user;
  }

  function getDiscordUser() {
    const user = localStorage.getItem(ADMIN_USER_KEY);
    return user ? JSON.parse(user) : null;
  }

  function isUserAdmin(user) {
    return user && user.role === 'admin';
  }

  function loginWithDiscord() {
    window.location.href = DISCORD_LOGIN_URL;
  }

  function logoutDiscord() {
    localStorage.removeItem(JWT_TOKEN_KEY);
    localStorage.removeItem(ADMIN_USER_KEY);
    window.location.reload();
  }

  function checkDiscordCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('discord_token');
    const userData = urlParams.get('user');
    const error = urlParams.get('error');
    
    if (error) {
      console.error('Discord login error:', error);
      showError('Login Discord gagal!');
      return false;
    }
    
    if (sessionToken && userData) {
      try {
        const user = JSON.parse(decodeURIComponent(userData));
        
        // Cek apakah user memiliki role admin
        if (user.role === 'admin') {
          localStorage.setItem(JWT_TOKEN_KEY, sessionToken);
          localStorage.setItem(ADMIN_USER_KEY, JSON.stringify(user));
          window.history.replaceState({}, document.title, window.location.pathname);
          return true;
        } else {
          console.error('User is not admin');
          showError('Anda tidak memiliki akses admin!');
          return false;
        }
      } catch (e) {
        console.error('Error parsing user data:', e);
        showError('Gagal memproses login');
        return false;
      }
    }
    return false;
  }

  function showError(message) {
    const errorDiv = document.getElementById('loginError');
    if (errorDiv) {
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 3000);
    }
  }

  function showLoading(show) {
    const loadingDiv = document.getElementById('loadingMsg');
    if (loadingDiv) {
      loadingDiv.style.display = show ? 'block' : 'none';
    }
  }

  // ========== DOM Elements ==========
  const loginScreen = document.getElementById('loginScreen');
  const adminContent = document.getElementById('adminContent');
  const discordAdminLogin = document.getElementById('discordAdminLogin');
  const adminLogoutBtn = document.getElementById('adminLogoutBtn');
  const adminUserInfo = document.getElementById('adminUserInfo');

  // ========== CHECK AUTH ==========
  function checkAuth() {
    // Cek callback Discord terlebih dahulu
    if (checkDiscordCallback()) {
      const user = getDiscordUser();
      if (user && isUserAdmin(user)) {
        loginScreen.style.display = 'none';
        adminContent.style.display = 'block';
        if (adminUserInfo) {
          adminUserInfo.innerHTML = `<i class="fab fa-discord"></i> ${user.globalName || user.username} (Admin)`;
        }
        loadSettings();
        listenOrders();
        return;
      }
    }
    
    // Cek session yang sudah ada
    if (isDiscordLoggedIn()) {
      const user = getDiscordUser();
      if (user && isUserAdmin(user)) {
        loginScreen.style.display = 'none';
        adminContent.style.display = 'block';
        if (adminUserInfo) {
          adminUserInfo.innerHTML = `<i class="fab fa-discord"></i> ${user.globalName || user.username} (Admin)`;
        }
        loadSettings();
        listenOrders();
        return;
      }
    }
    
    loginScreen.style.display = 'flex';
    adminContent.style.display = 'none';
  }

  // ========== DISCORD LOGIN EVENT ==========
  if (discordAdminLogin) {
    discordAdminLogin.onclick = () => {
      showLoading(true);
      loginWithDiscord();
    };
  }

  // ========== LOGOUT ==========
  if (adminLogoutBtn) {
    adminLogoutBtn.onclick = () => {
      logoutDiscord();
    };
  }

  // ========== LOAD SETTINGS ==========
  async function loadSettings() {
    const snap = await getDoc(doc(db, 'config', CONFIG_ID));
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById('adminPrice').value = d.pricePerRobux || 150;
      document.getElementById('adminStock').value = d.currentStock || 100;
      document.getElementById('adminPO').value = d.currentPO || 50;
      document.getElementById('adminPOLimit').value = d.poLimit || 100;
    }
  }

  // ========== SAVE SETTINGS ==========
  document.getElementById('saveSettingsBtn').onclick = async () => {
    await setDoc(doc(db, 'config', CONFIG_ID), {
      pricePerRobux: parseInt(document.getElementById('adminPrice').value),
      currentStock: parseInt(document.getElementById('adminStock').value),
      currentPO: parseInt(document.getElementById('adminPO').value),
      poLimit: parseInt(document.getElementById('adminPOLimit').value),
      updatedAt: new Date()
    });
    const fb = document.getElementById('saveFeedback');
    fb.textContent = '✅ Tersimpan!';
    setTimeout(() => fb.textContent = '', 2000);
  };

  // ========== STATS ==========
  function updateStats(orders) {
    document.getElementById('statWaiting').textContent = orders.filter(o => o.status === 'waiting_payment').length;
    document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending_verification').length;
    document.getElementById('statPaid').textContent = orders.filter(o => o.status === 'paid').length;
    document.getElementById('statDelivered').textContent = orders.filter(o => o.status === 'delivered').length;
    document.getElementById('statTotal').textContent = orders.length;
  }

  // ========== LISTEN ORDERS ==========
  function listenOrders() {
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(q, (snapshot) => {
      allOrders = [];
      snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
      updateStats(allOrders);
      applyFilterAndSearch();
    });
  }

  // ========== FORMAT DATE ==========
  function formatDate(dateValue) {
    if (!dateValue) return '-';
    try { if (dateValue?.toDate) return dateValue.toDate().toLocaleString('id-ID'); }
    catch { return '-'; }
    return '-';
  }

  // ========== GET EXPIRE TIME ==========
  function getExpireTimeLeft(expireAt, status) {
    if (status !== 'waiting_payment') return '';
    if (!expireAt) return '';
    try {
      const expDate = expireAt.toDate ? expireAt.toDate() : new Date(expireAt);
      const remaining = Math.max(0, Math.floor((expDate - new Date()) / 1000));
      const minutes = Math.floor(remaining / 60);
      const hours = Math.floor(minutes / 60);
      if (remaining <= 0) return '<span style="color:#dc3545;">⏰ Expired</span>';
      if (hours > 0) return `⏱️ ${hours}j ${minutes % 60}m`;
      if (minutes > 0) return `⏱️ ${minutes}m ${remaining % 60}d`;
      return `⏱️ ${remaining}d`;
    } catch { return ''; }
  }

  // ========== GET METHOD NAME ==========
  function getMethodName(method) {
    const names = { bca: 'BCA VA', mandiri: 'Mandiri VA', bni: 'BNI VA', bri: 'BRI VA', qris: 'QRIS' };
    return names[method] || method?.toUpperCase() || '-';
  }

  // ========== UPDATE ORDER STATUS ==========
  async function updateOrderStatus(orderId, newStatus) {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus, updatedAt: new Date() });
  }

  // ========== FILTER & SEARCH ==========
  function applyFilterAndSearch() {
    const status = document.getElementById('statusFilter')?.value || 'all';
    const search = document.getElementById('searchOrder')?.value?.toLowerCase() || '';
    let filtered = [...allOrders];
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    if (search) filtered = filtered.filter(o => o.id.toLowerCase().includes(search));
    renderOrders(filtered);
  }

  // ========== RENDER ORDERS ==========
  function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!container) return;
    if (orders.length === 0) { 
      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>✨ Tidak ada pesanan</p></div>'; 
      return; 
    }
    
    container.innerHTML = orders.map(order => {
      let statusClass = 'status-waiting_payment', statusText = '💳 Menunggu Bayar';
      if (order.status === 'pending_verification') { statusClass = 'status-pending_verification'; statusText = '⏰ Menunggu Verifikasi'; }
      else if (order.status === 'paid') { statusClass = 'status-paid'; statusText = '✅ Dibayar'; }
      else if (order.status === 'delivered') { statusClass = 'status-delivered'; statusText = '🎉 Terkirim'; }
      else if (order.status === 'cancelled') { statusClass = 'status-cancelled'; statusText = '❌ Dibatalkan'; }
      
      let deliveryClass = 'delivery-instant', deliveryText = '⚡ Instant';
      if (order.deliveryInfo?.includes('PO') || order.deliveryInfo?.includes('📦')) { deliveryClass = 'delivery-po'; deliveryText = '📦 Pre-Order'; }
      else if (order.deliveryInfo?.includes('Ditunda') || order.deliveryInfo?.includes('⏸️')) { deliveryClass = 'delivery-delayed'; deliveryText = '⏸️ Ditunda'; }
      
      const timerHtml = getExpireTimeLeft(order.expireAt, order.status);
      
      return `
        <div class="order-item">
          <div class="order-header">
            <div><span class="order-id"><i class="fas fa-hashtag"></i> ${order.id}</span></div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <span class="delivery-badge ${deliveryClass}">${deliveryText}</span>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
          </div>
          <div class="order-details">
            <div><div class="order-detail-label"><i class="fas fa-rocket"></i> Username</div><div class="order-detail-value">${order.robloxUsername || '-'}</div></div>
            <div><div class="order-detail-label"><i class="fas fa-coins"></i> Robux</div><div class="order-detail-value">${(order.robuxAmount || 0).toLocaleString()}</div></div>
            <div><div class="order-detail-label"><i class="fas fa-money-bill"></i> Total</div><div class="order-detail-value">Rp ${(order.totalPrice || 0).toLocaleString()}</div></div>
            <div><div class="order-detail-label"><i class="fas fa-credit-card"></i> Metode</div><div class="order-detail-value">${getMethodName(order.paymentMethod)}</div></div>
            <div><div class="order-detail-label"><i class="fas fa-code"></i> Kode Unik</div><div class="order-detail-value" style="color:#ffc107">${order.uniqueCode || '-'}</div></div>
            <div><div class="order-detail-label"><i class="fas fa-calendar"></i> Dibuat</div><div class="order-detail-value">${formatDate(order.createdAt)}</div></div>
          </div>
          ${timerHtml ? `<div class="timer-display">${timerHtml}</div>` : ''}
          <div class="order-actions">
            <select class="status-select" data-id="${order.id}">
              <option value="waiting_payment" ${order.status === 'waiting_payment' ? 'selected' : ''}>💳 Menunggu Bayar</option>
              <option value="pending_verification" ${order.status === 'pending_verification' ? 'selected' : ''}>⏰ Verifikasi</option>
              <option value="paid" ${order.status === 'paid' ? 'selected' : ''}>✅ Paid</option>
              <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>🎉 Delivered</option>
              <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Cancel</option>
            </select>
            <button class="btn-status btn-paid" data-id="${order.id}" data-status="paid">✅ Paid</button>
            <button class="btn-status btn-delivered" data-id="${order.id}" data-status="delivered">🎉 Delivered</button>
            <button class="btn-status btn-cancel" data-id="${order.id}" data-status="cancelled">❌ Cancel</button>
            ${order.status === 'pending_verification' ? `<button class="btn-status btn-verify" data-id="${order.id}" data-status="paid">✅ Verifikasi</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
    
    document.querySelectorAll('.status-select').forEach(s => s.onchange = (e) => updateOrderStatus(e.target.dataset.id, e.target.value));
    document.querySelectorAll('.btn-status').forEach(b => b.onclick = () => updateOrderStatus(b.dataset.id, b.dataset.status));
  }

  // ========== EVENT LISTENERS ==========
  document.getElementById('statusFilter')?.addEventListener('change', () => applyFilterAndSearch());
  document.getElementById('searchOrder')?.addEventListener('input', () => applyFilterAndSearch());
  document.getElementById('refreshOrders')?.addEventListener('click', () => applyFilterAndSearch());

  // ========== INIT ==========
  checkAuth();
</script>
</body>
</html>
